name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # We need to fetch all history and tags for versioning
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Extract version from commit message
        id: get_version
        run: |
          VERSION=$(echo "${{ github.event.head_commit.message }}" | grep -oE '[vV][0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "No version found in commit message. Skipping release."
            exit 0
          fi
          # Normalize to lowercase v
          VERSION=$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Get previous tag
        id: get_prev_tag
        if: steps.get_version.outputs.VERSION
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 ${{ steps.get_version.outputs.VERSION }}^ || echo "")
          echo "PREV_TAG=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: generate_changelog
        if: steps.get_version.outputs.VERSION
        run: |
          CHANGELOG=$(git log -1 HEAD --pretty=format:"* %s (%h)")
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update package.json and create tag
        if: steps.get_version.outputs.VERSION
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          npm version ${{ steps.get_version.outputs.VERSION }} --no-git-tag-version
          git add package.json package-lock.json
          git commit --amend --no-edit
          git tag -f ${{ steps.get_version.outputs.VERSION }}
          git push --force origin HEAD:main
          git push --force origin ${{ steps.get_version.outputs.VERSION }}

      - name: Build application
        if: steps.get_version.outputs.VERSION
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.get_version.outputs.VERSION
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          body: |-
            ${{ steps.generate_changelog.outputs.CHANGELOG }}
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify backend of new release
        if: steps.get_version.outputs.VERSION
        run: |
          RESPONSE=$(curl -s https://ipv4.quitsense.cn:10443/api/bjutautologin/checkNewRelease)
          
          echo "API Response: $RESPONSE"
          
          SUCCESS=$(echo "$RESPONSE" | jq -r '.success')
          if [ "$SUCCESS" != "true" ]; then
            MESSAGE=$(echo "$RESPONSE" | jq -r '.message')
            echo "::warning::Backend notification failed: $MESSAGE"
            exit 1
          fi
          
          echo "Backend notification successful"
